# Bash command prefixes the dev-team is allowed to run for this project.
# Each entry maps to a Bash(<prefix>:*) permission rule, granted by the
# develop skill's Step 3a before agents are spawned.
#
# Aligned with PROJECT_BRIEF.md: build.tool = uv, build.commands use `uv run pytest`
# and `uv run ruff`. `uv` is the entry point for the Python toolchain (venv, installs,
# and `uv run <tool>`), so it covers pytest/ruff/mypy/python invocations too.
commands:
  - uv
  - python
  - pytest
  - ruff
  - mypy
  # UC-15: the dependency-free viewer (viz/viewer.js) is syntax-checked with `node --check`
  # (developer gate + QA's viz-contract checks). Node runs no project runtime — check only.
  - node
  # UC-20: scripts/setup-sim-macos.sh (+ train.sh) are lint-gated with `shellcheck` where the
  # tool is installed (developer gate + QA's bootstrap-doc check, which skips if absent).
  - shellcheck
  # UC-31: scripts/setup-sim-windows.ps1 is lint/parse-gated with PowerShell (`pwsh`) +
  # PSScriptAnalyzer where installed (developer gate + QA's setup-windows-doc check, which
  # skips if absent — no Windows/pwsh runner in the Linux CI).
  - pwsh
