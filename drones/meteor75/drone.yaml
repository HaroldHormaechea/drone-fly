# BetaFPV Meteor75 Pro ANALOG: the plant the policies are trained on today (UC-56), ported
# value-for-value from gpu_prototype/hover_gpu.py (BatchedDrone) and src/drone_fly/adapter/meteor75.py.
# Not identified: nothing here was measured. The training code does not read this file yet (UC67).
# tests/test_drones_meteor75.py asserts it agrees with those two sources.
schema_version: 1
id: meteor75
name: BetaFPV Meteor75 Pro (analog)
source: analog
notes: >-
  Hover-relative port of the batched training plant. Hover is 0.4 there (HOVER_THR = 1/TW); the
  pybullet adapter's "hover ~0.5" comes from its own mixer and does not apply here.
analog:
  # Informational only (mass is not part of a hover-relative profile). From adapter/meteor75.py,
  # except gravity: hover_gpu.py uses G = 9.81 (9.8 in meteor75.py is the pybullet aviary's).
  mass_kg: 0.032
  thrust_to_weight: 2.5
  gravity_m_s2: 9.81
  wheelbase_m: 0.075
  arm_m: 0.02651650429449553
  prop_diameter_m: 0.04
  motor_fraction: 0.5
  sim_dt_s: 0.02          # hover_gpu.DT (50 Hz)
nominal:
  hover_throttle: {value: 0.4, ref: "gpu_prototype/hover_gpu.py HOVER_THR = WEIGHT / MAX_THRUST = 1/TW"}
  # Thrust is linear in collective: 0 at 0, TW = 2.5 g at full.
  thrust_curve: {throttle: [0.0, 1.0], accel_g: [0.0, 2.5], ref: "hover_gpu.py MAX_THRUST = TW * WEIGHT"}
  # Full stick = MAX_BODY_RATE 4 rad/s = 229.18 deg/s; Betaflight rc_rate = deg/s / 200 with no
  # super rate or expo is exactly linear (rc_rate < 2: no high-rate boost branch). hover_gpu maps the
  # action through tanh first; the stick here is the post-tanh value.
  # tau_s = 1/RATE_KP. hover_gpu's rate loop is a DISCRETE Euler step omega += KP * (cmd - omega) * DT
  # (KP * DT = 0.36 per 50 Hz step); tau is its continuous-time equivalent. UC67 must keep the
  # Euler form to reproduce BatchedDrone exactly.
  rates:
    ref: "hover_gpu.py MAX_BODY_RATE = 4.0, RATE_KP = 18.0; no rate delay"
    roll: {rc_rate: 1.1459155902616465, super_rate: 0.0, expo: 0.0, tau_s: 0.05555555555555555, delay_s: 0.0}
    pitch: {rc_rate: 1.1459155902616465, super_rate: 0.0, expo: 0.0, tau_s: 0.05555555555555555, delay_s: 0.0}
    yaw: {rc_rate: 1.1459155902616465, super_rate: 0.0, expo: 0.0, tau_s: 0.05555555555555555, delay_s: 0.0}
  drag: {linear_per_s: 0.0, quadratic_per_m: 0.0, ref: "hover_gpu.py has no drag"}
  motor_lag_s: {value: 0.0, ref: "hover_gpu.py applies thrust instantly"}
  latency: {input_s: 0.0, control_to_gyro_s: 0.0, ref: "hover_gpu.py has no action delay"}
  camera: null
# From gpu_prototype/gates_dr.py (the domain-randomized trainer):
randomization:
  # TW (1.8, 3.2) / nominal 2.5. MASS (0.025, 0.045) cancels out of thrust (maxthrust = TW*mass*G), so
  # it is not a separate parameter; it only scales drag (below).
  thrust_scale: {min: 0.72, max: 1.28}
  # RATE_KP (12, 26) -> tau = 1/KP, reversed.
  rates.roll.tau_s: {min: 0.038461538461538464, max: 0.08333333333333333}
  rates.pitch.tau_s: {min: 0.038461538461538464, max: 0.08333333333333333}
  rates.yaw.tau_s: {min: 0.038461538461538464, max: 0.08333333333333333}
  # LAG_TAU (0.02, 0.08); the lower bound is widened to 0 so the range contains the nominal 0.
  motor_lag_s: {min: 0.0, max: 0.08}
  # LAT 0..2 action steps of DT = 0.02 s. gates_dr delays ALL FOUR channels, throttle included:
  # UC67 must apply this delay to the throttle too.
  latency.control_to_gyro_s: {min: 0.0, max: 0.04}
  # DRAG (0, 0.08) is a quadratic FORCE coefficient divided by the randomized mass: as an
  # acceleration it spans 0 .. DRAG_max / MASS_min = 0.08 / 0.025 = 3.2 per metre.
  drag.quadratic_per_m: {min: 0.0, max: 3.2}
