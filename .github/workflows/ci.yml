name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      # Install the project + dev tools into an isolated, lockfile-pinned venv.
      # gym-pybullet-drones (GitHub-only) and the heavy sim/torch stack are intentionally
      # not required for lint+test; the suite mocks external calls and does not run real
      # training. `uv sync` respects uv.lock for reproducible installs.
      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
