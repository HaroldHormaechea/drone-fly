[project]
name = "drone-fly"
version = "0.0.0"
description = "Connectome-seeded quadrotor flight: the MaleCNS connectome as a frozen reservoir with a small trained readout."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harold Hormaechea" }]

# Runtime dependencies for the deployed/library path: the frozen-K1 reservoir models
# (gpu_prototype/) + the shared connectome/record library (src/drone_fly). The old
# Stable-Baselines3 / gymnasium / pybullet training lineage was removed in the 2026-10
# cleanup (superseded by the reservoir approach); its deps are gone with it.
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "pandas",
    "neuprint-python==0.6.3",   # connectome fetch (drone_fly.connectome.fetch)
    "pyyaml",                   # config loading for harnesses / tooling
    "matplotlib",               # soma-position projections for the viewer
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pip-audit",
]
# Live-harness backends (drone_fly.harness): screen capture, OpenCV gate detection, the
# monocular depth model and the ViGEm virtual gamepad. All lazily imported; the core package
# and CI do not need them. Install with `uv sync --extra harness`.
harness = [
    "opencv-python",
    "mss",
    "dxcam; sys_platform == 'win32'",
    "vgamepad; sys_platform == 'win32'",
    "transformers",
    "pillow",
]

[project.scripts]
drone-fly = "drone_fly.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_fly"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/drone_fly"]
ignore_missing_imports = true
warn_return_any = false
