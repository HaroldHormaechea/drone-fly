[project]
name = "drone-fly"
version = "0.0.0"
description = "Connectome-seeded reinforcement-learning quadrotor racing controller, using the MaleCNS connectome."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harold Hormaechea" }]

# Runtime dependencies. Declared for reproducibility; NOT installed by scaffolding.
# gym-pybullet-drones is not on PyPI — install from GitHub when setting up for real:
#   uv pip install "git+https://github.com/utiasDSL/gym-pybullet-drones"
#
# axonweave: intended as the connectome-substrate layer. As of UC-01 it is NOT
# installable in this environment — it is absent from PyPI (all name variants 404) and
# its source repository is not publicly reachable. The plan's grounding note that
# "AxonWeave v0.2.0 is on PyPI" is therefore stale (flag for a later revise-brief).
# Because an uninstallable dependency would break `uv pip install -e ".[dev]"` and CI,
# axonweave is intentionally left OUT of the installed dependency set. The controller
# uses AxonWeave automatically if it ever becomes importable, and otherwise falls back
# to the in-repo SparseConnectomeLayer shim (see drone_fly.controller.policy). Add it
# here once a real, installable distribution is reachable.
dependencies = [
    "torch",
    "gymnasium==1.3.0",
    "stable-baselines3==2.9.0",
    "neuprint-python==0.6.3",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "tensorboard",
    "python-dotenv",
    # UC-11: the CLI loads all run settings from a YAML `--config`, so the parser imports
    # PyYAML unconditionally. It is a CORE dependency (CI installs `--extra dev` only and
    # never the `sim` extra), so it must sit here, not under an optional group.
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pip-audit",
]

# Optional simulator backend (UC-03). PyBullet is the native rigid-body engine the
# PyBulletAdapter (mastery physics) drives. It is a prebuilt wheel with a native
# extension; on some hosts pip must build it from source (needs a C/C++ toolchain).
# NOTE: CI installs `--extra dev` ONLY and never this extra — the whole default/test/
# smoke path uses the pure-numpy SimpleDroneAdapter, so CI stays hermetic (no pybullet).
#
# gym-pybullet-drones is GitHub-only (not on PyPI) and is therefore NOT listed here; it is
# installed from a pinned commit by `scripts/train.sh` (see that script and the README
# "Simulator bootstrap" boundary table). pybullet 3.2.6 requires numpy<2 at runtime
# (its wheel is built against the numpy 1.x ABI); newer pybullet builds relax this.
sim = [
    "pybullet==3.2.6",
]

[project.scripts]
drone-fly = "drone_fly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_fly"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic prototype-friendly set: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/drone_fly"]
ignore_missing_imports = true
# Non-blocking at prototype stage.
warn_return_any = false
