[project]
name = "drone-fly"
version = "0.0.0"
description = "Connectome-seeded quadrotor flight: the MaleCNS connectome as a frozen reservoir with a small trained readout."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harold Hormaechea" }]

# Runtime dependencies for the deployed/library path: the frozen-K1 reservoir models
# (gpu_prototype/) + the shared connectome/record library (src/drone_fly). The old
# Stable-Baselines3 / gymnasium / pybullet training lineage was removed in the 2026-10
# cleanup (superseded by the reservoir approach); its deps are gone with it.
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "pandas",
    "neuprint-python==0.6.3",   # connectome fetch (drone_fly.connectome.fetch)
    "pyyaml",                   # config loading for harnesses / tooling
    "matplotlib",               # soma-position projections for the viewer
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pip-audit",
    # UC-61/UC-63: the desktop app's FastAPI/Uvicorn backend. Placed in `dev` (NOT the default deps)
    # so CI — which installs `--extra dev` only — can import `app.server` and drive it hermetically
    # via starlette's TestClient (bundled with FastAPI), with no display and no GPU. `pywebview` is
    # deliberately OMITTED here: it needs a native display, so it lives in the `app` extra below.
    "fastapi",
    "uvicorn",
    "httpx",
]
# UC-61/UC-63: the desktop app runtime extra. `pywebview` opens the native window around the local
# FastAPI server; it needs a display, so it is NOT in `dev`/CI. Install with `uv sync --extra app`
# on a machine with a desktop to run `python -m app`.
app = [
    "fastapi",
    "uvicorn",
    "pywebview",
]
# Live-harness backends (drone_fly.harness): screen capture, OpenCV gate detection, the
# monocular depth model and the ViGEm virtual gamepad. All lazily imported; the core package
# and CI do not need them. Install with `uv sync --extra harness`.
harness = [
    "opencv-python",
    "mss",
    "dxcam; sys_platform == 'win32'",
    "vgamepad; sys_platform == 'win32'",
    "transformers",
    "pillow",
]
# UC-65: the live brain + debug overlay window (`drone-fly harness overlay`). PySide6 (Qt, the
# Essentials wheel: QtCore/QtGui/QtWidgets only) is imported lazily and only by
# drone_fly/overlay/window.py; it needs a desktop, so it is NOT in `dev`/CI. The window applies
# Win32 styles, hence the Windows marker. Install with `uv sync --extra overlay`.
overlay = [
    "PySide6-Essentials; sys_platform == 'win32'",
]
# UC68: optional Liftoff scene / props extraction (`drone-fly tracks extract-scenes`,
# `extract-props`). UnityPy is imported lazily inside the extract functions only; reading the
# cached JSON needs nothing. Install with `uv sync --extra liftoff-extract`, or into an existing
# venv: `uv pip install --python <venv python> UnityPy==1.25.4`.
liftoff-extract = [
    "UnityPy==1.25.4",
]

[project.scripts]
drone-fly = "drone_fly.cli.main:main"
# UC-61/UC-63: launch the desktop app (local FastAPI server + pywebview window). Requires the
# `app` extra. From a source checkout, `python -m app` is equivalent.
drone-fly-app = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_fly", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is on the import path so the app tests can `import app` (the desktop-app package
# lives at the repo root, outside `src/`).
pythonpath = ["src", "."]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/drone_fly"]
ignore_missing_imports = true
warn_return_any = false
