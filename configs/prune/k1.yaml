# Example `drone-fly prune --config` — k=1 subcircuit slice.
#
#   drone-fly prune --config configs/prune/k1.yaml
#
# No `connectome:` key -> defaults to the full MaleCNS connectome (auto-downloaded on first run,
# reused after; ~161k neurons / ~25M edges -> minutes + real memory). Add `connectome: <dir>` to
# prune a specific artifact with no download (see k0.yaml).

out: artifacts/pruned/k1     # REQUIRED: output dir for the pruned slice (+ provenance)
prune_k: 1                   # 1 = one hop of path slack around the shortest-path corridor
