# Example `drone-fly prune --config` — tightest (k=0) sensory->motor subcircuit slice.
#
#   drone-fly prune --config configs/prune/k0.yaml
#
# With no `connectome:` key, prune defaults to the full MaleCNS connectome: on first run it
# auto-downloads ~109MB into the default location (DRONE_FLY_CONNECTOME_DIR, else data/connectome)
# and reuses it after. Pruning the full matrix (~161k neurons / ~25M edges) takes minutes + real
# memory — expected, not a hang. To prune a specific artifact instead (no download), add e.g.
# `connectome: tests/fixtures`. The output lands under artifacts/ (gitignored).

out: artifacts/pruned/k0     # REQUIRED: output dir for the pruned slice (+ provenance)
prune_k: 0                   # 0 = tight shortest-path corridor
