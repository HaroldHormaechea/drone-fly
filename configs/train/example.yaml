# Example `drone-fly train --config` file.
#
# Runs as-is against the committed test-fixture connectome on the pure-numpy backend, so it
# needs no simulator and no provisioned connectome. Outputs land under
# `training/<name>/{checkpoints,logs,recordings}/`.
#
#   drone-fly train --config configs/train/example.yaml

# REQUIRED. All outputs go to training/<name>/. Allowed chars: letters, digits, . _ -
name: baseline

# Sim backend: auto (pybullet if installed) | simple (numpy, no native deps) | pybullet.
adapter: simple

# Connectome to seed the policy. The committed fixture keeps this runnable in CI; point it
# at your provisioned connectome dir (or a pruned slice from `drone-fly prune`) for a real run.
connectome: tests/fixtures

# Smoke-sized budget so the example finishes quickly. Raise it (e.g. 2_000_000, the default for a
# restaggered real run) for a real run. NOTE (UC-51): `timesteps` also sets the curriculum schedule
# window — the attitude/collision/airborne curricula anneal over fractions of THIS value — so a real
# run needs a real budget for the isolated floor-takeoff tail to get room.
timesteps: 2000

# Idempotent resume: continue from the newest checkpoint under training/<name>/checkpoints/
# if one exists, otherwise start fresh (no error). Use `latest` to REQUIRE an existing
# checkpoint (hard error if none), or omit / set `null` for an always-fresh run.
resume: auto

# --- Optional keys (shown with their defaults; delete any you don't need) ---
# device: cpu            # cpu | cuda | mps; omit for the auto-policy
# n_envs: 8              # rollout worker count. The vec-env backend is chosen automatically
#                        # (UC-26): SubprocVecEnv (one OS process per env → real cross-core
#                        # parallelism) is used iff the resolved adapter is `pybullet` AND
#                        # n_envs > 1; otherwise DummyVecEnv (serial, in-process). The `simple`
#                        # adapter ALWAYS stays serial on DummyVecEnv — subprocess IPC would
#                        # only add overhead for the cheap numpy model (an explicit n_envs > 1
#                        # on `simple` warns and stays serial). Workers use the `spawn` start
#                        # method (safe on macOS + native libs like pybullet); each rebuilds its
#                        # env from cheap config. When omitted on a parallel (pybullet) run,
#                        # n_envs defaults to 8. Sweet-spot ≈ the machine's PERFORMANCE-core
#                        # count (8 = the M4 Pro's 8 P-cores); going past the P-cores onto
#                        # efficiency cores oversubscribes and yields little. The non-parallel
#                        # path (unset + simple, or explicit 1) keeps the old default of 1.
# prune: false           # reduce to the sensory->motor subcircuit (UC-04) before training
# prune_k: 2             # corridor slack for prune
# record: false          # capture per-frame activations for the viz/ viewer (UC-05)
# record_every: 1        # record every Nth episode (only meaningful with record: true)
# record_dir: null       # override; defaults to training/<name>/recordings/
# randomize: false       # randomize the course per episode (UC-08)
# randomize_dynamics: false  # randomize mass/drag/thrust/latency per episode (UC-08)
#
# --- Course randomization: schema + per-feature placement toggles (UC-13 / UC-24) ---
# schema: null           # observation schema. Omit / null on a NON-randomized run = the legacy
#                        # single-projection observation. On a randomized run (`randomize: true`)
#                        # omitting it defaults to the FULL `damage_proprioception_v4` (26-d) schema.
#                        # Named schemas: migrated_v1 | obstacle_vision_v2 | battery_hunger_v3 |
#                        # damage_proprioception_v4.
#
# By DEFAULT a bare `randomize: true` (no schema, no toggles below) trains against the FULL course:
# the `damage_proprioception_v4` schema PLUS obstacle + one recharge pad + one repair pad placement
# all ON (exactly one recharge pad and one repair pad per course — feature presence, not a cover).
# The three toggles below are THREE-STATE: leave them out (or `null`) to take that schema-aware
# default (a feature is placed only when the effective schema carries the block that can sense it),
# or set `true`/`false` to force a feature on/off independently. Enabling a recharge pad requires a
# schema with a `battery` block, and a repair pad a schema with a `damage` block — otherwise the
# pad would be inert, so the run FAILS LOUD (exit 2) rather than silently placing nothing.
#
# RETRAIN / CHECKPOINT INVALIDATION: defaulting randomized runs to the 26-d schema changes the
# observation width, so pre-UC-24 randomized-run checkpoints are invalidated and need a fresh
# retrain (the same class of change as the UC-13/15/17/19 schema extensions). A bare
# `randomize: true` also now trains against a much harder course (obstacles + energy/damage).
#
# randomize_obstacles: null       # place pillars (default: on when randomize + schema has obstacle_vision)
# randomize_recharge_pads: null   # place ONE recharge pad (default: on when randomize + schema has battery)
# randomize_repair_pads: null     # place ONE repair pad (default: on when randomize + schema has damage)
# strict_capacity: false # UC-23 pre-train guardrail: when the seeded (post-prune) actor is
#                        # under-capacity, abort with exit code 3 in any mode. Default false
#                        # prompts on an interactive TTY and warn-and-continues non-interactively.
# capacity_floor: null   # UC-23 override for the actor trainable-parameter floor (default 3000,
#                        # calibrated so the k=2 default slice passes and a k=0 slice trips it).
#
# --- Training curriculum schedule + exploration (UC-51) -----------------------------------------
# All keys below are OPTIONAL and shown with their NEW UC-51 defaults. Omitting a key — or setting
# it to the value shown — is byte-identical to the default run (set-to-default == omit). Each is
# validated (type + range) at config load: fractions must be in [0, 1], ent_coef >= 0, the collision
# penalties >= 0; out-of-range or unknown values fail loud with a clear error (exit 2).
#
# The DEFAULT schedule is RESTAGGERED so the difficulty steps are ISOLATED and floor-takeoff is the
# last, longest stage — collision-full (~0.5) < spawn-reaches-floor (1.0). (UC-55 retired the
# attitude-authority stage that used to lead this ordering.) Each fraction is a fraction of `timesteps`.
#
# ent_coef: 0.005        # PPO entropy coefficient (exploration). Strictly positive keeps the action
#                        # distribution exploring long enough to discover takeoff (UC-38/40/41).
#
# Attitude-authority curriculum (UC-46): RETIRED in UC-55. It was a crude stand-in for the missing
# inner-loop rate controller; UC-55 adds that controller and removes these keys. Use the rate-
# controller gains below to shape the plant instead.
#
# Inner-loop rate-controller gains (UC-55): retune the body-rate PID (the "flight controller") from
# config, no code edit. All OPTIONAL, non-negative; omitting a key — or setting it to its
# RateControllerConfig default — is byte-identical to the default run. The rate loop is pybullet-only.
# rate_kp: 0.6              # proportional gain on body-rate error (setpoint - measured)
# rate_ki: 0.1             # integral gain (anti-windup clamped)
# rate_kd: 0.02            # derivative gain (damps the noisy full-range regime)
# rate_max_body_rate: 4.0  # full-stick body-rate clamp (rad/s); +/-1 command -> +/-this setpoint
#
# Collision-penalty curriculum (UC-39/41): hold-then-ramp crash-cliff relief. The penalty is held
# low through `hold_fraction`, then ramps to full over `warmup_fraction` (the RAMP WIDTH), reaching
# full at hold + warmup = 0.4 + 0.1 = 0.5 — the isolated mid-training step (after attitude-full,
# before the airborne floor descent).
# collision_curriculum_enabled: true
# collision_penalty_start: 2.0              # held value through the fly-learning phase
# collision_penalty_end: 100.0             # full-strength value after the ramp
# collision_curriculum_hold_fraction: 0.4  # hold the start value through this fraction
# collision_penalty_warmup_fraction: 0.1   # RAMP WIDTH after the hold (hold + warmup <= 1)
#
# Airborne-start curriculum (UC-44): the training spawn is held airborne early, then descends to the
# floor so floor-takeoff is learned LAST. Restaggered to hold airborne through ~0.6 then reach the
# floor only at 1.0 — the last, longest, isolated stage.
#   IMPORTANT semantic contrast: here `warmup_fraction` is a HOLD / START-DELAY (the spawn stays
#   fully airborne through it before descending), the OPPOSITE of the collision `warmup_fraction`
#   above (which is the ramp width). They must compose coherently: warmup <= anneal.
# airborne_curriculum_enabled: true
# airborne_curriculum_warmup_fraction: 0.6  # HOLD airborne through this fraction (start-delay)
# airborne_curriculum_anneal_fraction: 1.0  # spawn reaches the floor by this fraction (end of run)
#
# --- PPO optimization hyperparameters (UC-54) ---------------------------------------------------
# All four keys below are OPTIONAL and shown with their CURRENT defaults. Omitting a key — or setting
# it to the value shown — is byte-identical to the default run (set-to-default == omit). They tune the
# optimize-phase speed vs. sample-efficiency / VRAM trade-off surfaced by UC-52 (the optimize phase is
# ~91% of each iteration's wall-clock). Each is validated at config load: the three ints must be >= 1
# and learning_rate > 0 (out-of-range or wrong-typed values fail loud with a clear error, exit 2).
# Note: batch_size need NOT divide n_steps*n_envs — SB3 uses a partial final minibatch (no hard
# check).
# n_epochs: 10           # gradient passes over each rollout buffer. Lower = faster iterations but
#                        # fewer passes (less sample-efficient); e.g. 5 is a ~free speedup lever.
# batch_size: 64         # minibatch size for each gradient step. Larger = better GPU utilization but
#                        # more VRAM — watch for OOM on an 8 GB GPU when raising to 128/256.
# n_steps: 2048          # rollout-buffer size per env. Changes the buffer size (n_steps*n_envs) and
#                        # therefore the iteration count (total_timesteps / (n_steps*n_envs)).
# learning_rate: 3e-4    # PPO/Adam step size. Must be strictly > 0.
