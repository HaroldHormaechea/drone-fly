# Example `drone-fly train --config` tuned for an NVIDIA RTX A3000 Laptop GPU (6 GB VRAM)
# training the k=1 MaleCNS slice (~25,627 neurons, ~3.86M actor params).
#
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#   NVIDIA_TF32_OVERRIDE=1 \
#   drone-fly train --config configs/train/example-gpu-rtx-a3000.yaml
#
# WHY THESE VALUES — measured throughput sweep on this card (RTX A3000 Laptop, 6 GB), k=1 slice,
# pybullet backend, steady-state fps (post-warmup):
#
#   batch_size  n_epochs  TF32   fps    VRAM peak   note
#   16          5         off     69    ~1.8 GB     baseline
#   48          5         off     69    ~3.8 GB     batch_size alone does NOT move throughput
#   32          3         on     ~116   ~3.2 GB     << chosen: n_epochs is the real lever (+~1.7x)
#   48          3         off    ~103   ~3.8 GB     same speed as 32, less VRAM headroom
#   64/128      any       any    OOM     -          >6 GB: backward through the 3.86M-param actor
#
# Takeaways for this 6 GB card + large connectome actor:
#   * n_epochs is the throughput lever (5 -> 3 ≈ +50% fps). It trades a little sample efficiency
#     for speed — raise back toward 10 if you have the wall-clock and want max sample efficiency.
#   * batch_size does NOT change fps here (the optimize GPU-compute is not the bottleneck; the fixed
#     per-iteration rollout + overhead is). Keep it modest (32) for VRAM headroom; batch >= 64 OOMs.
#   * TF32 (NVIDIA_TF32_OVERRIDE=1) showed no measurable gain on this workload but is harmless; kept
#     for other/denser workloads where it does help on Ampere.
#   * PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True is REQUIRED-in-practice: it reduces allocator
#     fragmentation that otherwise triggers spurious OOM near the 6 GB ceiling.
#
# Provisioning the connectome (one-time):
#   drone-fly fetch-connectome                 # downloads full MaleCNS into data/connectome/
# This config prunes to the k=1 slice in-process each run. To skip re-pruning 161k neurons every
# run, pre-prune once and point `connectome:` at the output (and set prune: false):
#   drone-fly prune --config configs/prune/k1.yaml   # writes artifacts/pruned/k1/

name: k1-a3000
adapter: pybullet
connectome: data/connectome    # full MaleCNS (run `drone-fly fetch-connectome` first)
prune: true
prune_k: 1                     # ~25.6K-neuron sensory->motor slice (the validation-scale target)
timesteps: 300000
resume: auto

# --- RTX A3000 (6 GB) throughput profile ---
device: cuda
n_envs: 6                      # parallel pybullet rollout workers (physics is CPU-bound)
n_steps: 512                   # rollout buffer per env (512 * 6 = 3072 transitions/iteration)
batch_size: 32                 # fits 6 GB with headroom (~3.2 GB peak); batch_size does not affect fps here
n_epochs: 3                    # the throughput lever: 3 instead of the default 10 ≈ +~1.7x fps
