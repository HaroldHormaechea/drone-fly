# UC-87 deploy-robust — live-flight harness preset for the 98-dim deploy-robust policy.
#
# A PRESET overlaid on the packaged default (liftoff_5inch.yaml / liftoff_arena.yaml). Flies the
# 98-dim memory model (obs-contract v2) exported to this folder:
#
#   drone-fly harness run \
#     --checkpoint training/13-deploy-robust/model_readout.pt \
#     --extra-dim 98 \
#     --preset liftoff_arena --config training/13-deploy-robust/harness-liftoff.yaml
#
# The two alignment hacks that model 11 needed are OFF here, because UC-87 trained them away:
#   * runner.align_spawn_yaw: false — the policy saw a uniform 0..360 deg spawn yaw in training, so
#     the live frame no longer has to be rotated onto a fixed training heading.
#   * runner.latency_compensation: off — UC-87 trained WITH the live control timing + ~75 ms
#     actuation delay and a previous-action/history memory input, so the Smith predictor is
#     redundant (and the v2 action contract is not eligible for it anyway).
#
# Everything else (camera FOV/uptilt, HUD masks, the learned gate detector + eyes free-space
# estimator, telemetry) is inherited from the base liftoff preset — calibrate the camera block for
# your resolution/track as usual (see src/drone_fly/harness/configs/liftoff_arena.yaml).
harness: liftoff

runner:
  align_spawn_yaw: false
  latency_compensation: off
