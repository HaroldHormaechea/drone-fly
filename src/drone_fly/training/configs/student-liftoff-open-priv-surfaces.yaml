# UC-79 student information-gap ablation — variant `surfaces` (64 values).
#
# student-liftoff-open + the MLP actor + the shortened ablation budget, appending ONLY the teacher's
# full 8-nearest-surfaces block (8 × 8, incl. the floor/terrain under the drone), 64 values. On
# obstacle-free open courses this block holds only scene colliders, route-gate frames and the floor
# (no placed props) — which is exactly what the open student meets (see the UC docs caveat). Always
# exact, sim-only, diagnostic, never deployable. Obs dim = 65 + 64 = 129. See
# student-liftoff-open-priv-baseline.yaml for the budget/equalizer rationale and
# docs/experiments/uc79-student-information-gap.md.
extends: student-liftoff-open
name: student-liftoff-open-priv-surfaces
n_envs: 2048
budget: 1.8e7              # EQUAL across all 7 (AC6)
student:
  actor: mlp-student
distill:
  max_hours: null
  student_privileged: [surfaces]
