# UC-80 distillation-training-fix ablation — BASELINE (current UC-77/79 distillation).
#
# The like-for-like control for the three intervention variants (on_policy / beta / ppo). It is
# `student-liftoff-open` with the MLP actor and the equal UC-80 step budget, and NO new UC-80
# fields, so the distillation is byte-identical to UC-77/79 (the β-mix selects execution, no PPO,
# the default linear β 1.0→0.0 over half the budget). Every variant is compared against this row.
#
# Equal-budget (AC5/AC8): `budget` below is the TOTAL env-steps and is IDENTICAL across all four
# runs. The PPO variant splits its 1.8e7 into 1.2e7 DAgger + 6e6 PPO; baseline/on_policy/beta
# spend the whole 1.8e7 on DAgger. Both loops count env-steps, so the budgets are comparable.
#
# Budget sizing mirrors UC-79 (≈ 45 min on an RTX 3050 at n_envs 2048; the MLP forward is far
# cheaper than the K1 connectome propagation so ≈ 6,700 env-steps/s at 2048 envs). The inherited
# 3.5 h DAgger wall-cap is far above this, so it never truncates a run; the step budget governs.
#
# Run it via scripts/uc80_distillation_fix.sh (resumable driver) — see
# docs/experiments/uc80-distillation-training-fix.md.
extends: student-liftoff-open
name: student-liftoff-open-uc80-baseline
n_envs: 2048
budget: 1.8e7              # UC-80 equal budget (total env-steps), IDENTICAL across all four runs
student:
  actor: mlp-student      # UC-80 scope is MLP-only (matches UC-79); default is k1-student, so explicit
distill:
  final_report: true      # held-out + Infinity Loop, exact + noise, 32 ep / seed 1234 (inherited; explicit)
