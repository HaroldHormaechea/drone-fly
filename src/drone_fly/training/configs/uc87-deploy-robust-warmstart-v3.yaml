# UC-87 run 6 — run 5 + UNIFORM delay distribution (recover perfect-preset completion).
# Run 5 (warm-start) WON live-like: smoother than model 11 (yaw-flips 1.79 vs 7.11, sat 1.5% vs 9.6%,
# mean|Δ| 0.739 vs 1.345) AND completed slightly more (28.9% vs 27.3%). But perfect-preset completion
# was 0% — because run 5's delay dist was triangular@75ms, so zero-delay ("perfect") was nearly
# out-of-distribution and the policy over-adapted to expecting delay. Fix: uniform delay [0,100ms] so
# zero-delay is in-distribution and the policy stays robust across the FULL timing range incl. clean.
extends: uc87-deploy-robust-warmstart
name: uc87-r6-uniformdelay
budget: 16.0e6

timing:
  mode: random
  control_hz: [16.7, 50.0]
  action_delay_s: [0.0, 0.100]
  action_delay_dist: uniform      # was triangular@75ms in run 5 — include zero-delay (perfect) in-dist
  delay_jitter_s: 0.005
  skip_prob: [0.0, 0.35]

curriculum:
  difficulty_frac: null
  obs_pos_frac: null
  obs_count_frac: null
  timing_dr_frac: [0.15, 0.45]
  input_dr_frac: [0.45, 0.75]
  penalty_frac: [0.25, 0.65]
  penalty_init_scale: 0.1
