# UC68 run 2 (ADR 0007 D9 + D11): the single val-driven change set, from scratch, on conversion
# v4 courses with the battery + thrust-at-speed model (drones/liftoff-gremlin-micro power block):
#   drone-fly train teacher --config teacher-liftoff-aug
#  - power: pack drain, persistent voltage sag, low-voltage cutoff (episode outcome power_loss)
#    and the full-stick thrust drop with axial inflow, fitted on UC66 sysid + UC69 live telemetry
#  - augmentation (training only): every Liftoff train course is also flown mirrored (y -> -y)
#    and at 0.85x / 1.15x scale (all 6 combinations; geometry only, physics unchanged)
#  - procedural share 0.5 (was 0.4)
#  - checkpoints every ~1.2e8 steps (229 iterations at 8192 envs x 64) for val selection
extends: teacher-liftoff
name: teacher-liftoff-aug
budget: 2.0e9
plant:
  power: true
tracks:
  mix:
    - {select: "liftoff:train", weight: 0.5, scene_weight: 2.0}
    - {select: "procedural:proc-liftoff", weight: 0.5}
  augment:
    mirror: true
    scales: [0.85, 1.0, 1.15]
checkpoint_every_iters: 229
