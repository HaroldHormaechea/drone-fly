# UC-87 run 5 — WARM-START base + gentle staggered DR (fresh-from-scratch can't hold full-difficulty
# completion: runs 3 & 4 both collapsed to ~0% as difficulty reached full, even before any DR).
# Model 11 already completes ~56% at FULL difficulty, so: warm-start it, keep difficulty FULL from the
# start (no destabilizing ramp), and ONLY ramp in the deployment/perception DR + the action-rate λ.
# Runs 1-2 (also warm-start) failed ONLY due to spawn-yaw randomisation + DR shock — both fixed here
# (spawn aligned + aligner kept; DR ramped not shocked). Memory columns zero-init => starts == model 11.
extends: uc87-deploy-robust-warmstart
name: uc87-r5-warmstart
budget: 16.0e6

curriculum:
  # Full difficulty / obstacles from step 0 — model 11 already solves this; no ramp (null = full).
  difficulty_frac: null
  obs_pos_frac: null
  obs_count_frac: null
  # Gentle staggered DR on top of the completing warm-start base (brief 0-15% clean settle first).
  timing_dr_frac: [0.15, 0.45]    # Deployment: timing/delay/τ
  input_dr_frac: [0.45, 0.75]     # Perception: input noise
  penalty_frac: [0.25, 0.65]      # anneal action-rate λ in as DR ramps
  penalty_init_scale: 0.1
