# Packaged default for the `liftoff` harness: Liftoff, 5-inch FPV airframe.
# Overlay your own --config on this file to switch game / airframe settings; keys that are not
# listed here are rejected. Values marked CALIBRATE are documented assumptions that must be
# checked against your Liftoff setup (see docs/adr/0002-live-harness-layering.md).
# Packaged presets (e.g. `--preset liftoff`, the calibrated small quad on Liftoff
# Arena) are overlays on this file; see docs/adr/0003-real-liftoff-calibration.md.
#
# Example (obstacle-free course, 30-dim model):
#   drone-fly harness run --harness liftoff --extra-dim 30 \
#     --checkpoint training/07-proc-course-flight/model_readout.pt --config my_liftoff.yaml
# The 70-dim obstacle model (training/11-count-curriculum/model_readout.pt, or the older
# training/10-proc-obstacle-avoid/model_readout.pt) needs a raycast-capable free-space
# estimator (parts.free_space_estimator: depth).
harness: liftoff

# The airframe flown (UC67): drones/<id>/drone.yaml. Its Betaflight rates and its inverse thrust
# curve map the policy's command (collective_g, body rates) to sticks, replacing the old CALIBRATE
# placeholders controls.rates / controls.hover_stick (which must then stay null). This profile was
# identified in Liftoff by `drone-fly sysid` (UC66) with fit_quality: poor (rate fit errors above
# the 15 % limit; see drones/liftoff-5inch-vortex-pro-250/sysid.md). Set `drone: null` and fill
# controls.rates / controls.hover_stick to fly an airframe without a profile.
drone: liftoff-5inch-vortex-pro-250

contract:
  gpu_prototype_dir: null   # null -> $DRONE_FLY_GPU_PROTOTYPE -> <repo>/gpu_prototype
  k1_path: null             # null -> $DRONE_FLY_K1_PATH -> <repo>/artifacts/pruned/k1
  device: auto              # auto | cpu | cuda

runner:
  rate_hz: 50               # the models were trained at 50 Hz (contract DT = 0.02 s)
  clock: wall
  stale_after_s: 0.2        # telemetry older than this -> fail-safe
  max_estimate_age_s: 0.25  # free-space estimate older than this -> fail-safe (when needed)
  wait_for_state_s: 10.0    # time allowed for the first telemetry datagram
  max_duration_s: null      # null = until abort / fail-safe
  max_ticks: null

parts:
  state_source: liftoff-udp       # liftoff-udp | liftoff-csv (replay a recorded CSV)
  frame_source: screen
  gate_estimator: opencv
  free_space_estimator: none      # none (obstacle-free, 12/30-dim only) | depth (70-dim)
  action_sink: vgamepad
  abort_signal: hotkey
  focus_probe: win32-foreground   # fail safe when the Liftoff window loses focus (null = off)

# Options for programmatically registered parts, keyed by part kind (free-form).
part_options: {}

scaling:
  # training_m = liftoff_m / world_scale. The models know a 32 g whoop world (gates 0.45-1.5 m,
  # RAY_RANGE 4 m); a 5-inch Liftoff track is larger. CALIBRATE against your track.
  world_scale: 2.0

telemetry:
  host: 127.0.0.1
  port: 9001                # Liftoff TelemetryConfiguration.json EndPoint. CALIBRATE
  # Liftoff StreamFormat order (TelemetryConfiguration.json). CALIBRATE to match yours.
  stream_format: [timestamp, position, attitude, velocity, gyro, inputs, battery, motor_rpm]
  block_widths:
    timestamp: 1
    position: 3
    attitude: 4
    velocity: 3
    gyro: 3
    inputs: 4
    battery: 2
    motor_rpm: 4
  # MEASURED 2026-10-11 (UC-64, live capture, 97-byte datagrams): MotorRPM = uint8 motor count +
  # that many floats. Describes Liftoff, not the airframe.
  rpm_count_prefix: true
  gyro_units: deg_s         # MEASURED 2026-10-11 (gyro_check, |scale| 1.00): deg/s
  # Contract body rate (FLU) <- sign * gyro[source]. MEASURED 2026-10-11 (UC-64, gyro_check on a
  # 182 s hand-flown capture, |corr| 0.99): the earlier roll/pitch signs were inverted. Describes
  # Liftoff, not the airframe.
  gyro_map:
    wx: {source: roll, sign: -1}
    wy: {source: pitch, sign: 1}
    wz: {source: yaw, sign: -1}
  max_position_jump_m: 5.0  # per-sample jump (Liftoff metres) treated as a respawn
  ring_size: 1024
  replay_csv: null          # for state_source: liftoff-csv

camera:
  backend: auto             # auto (dxcam, else mss) | dxcam | mss
  monitor: 1
  region: null              # [left, top, width, height] of the game view, or null = monitor
  fps: 60
  resolution: null          # [w, h] the FOV refers to; null = use the captured frame size
  hfov_deg: 120.0           # Liftoff camera FOV (horizontal). CALIBRATE
  uptilt_deg: 25.0          # FPV camera angle. CALIBRATE
  # Screen regions ignored by gate detection, auto-labelling and depth sampling (HUD, ghost list).
  # Each {name, rect: [x, y, w, h]} in pixels at `resolution` (required when masks are set).
  masks: []

gates:
  nominal_width_m: 1.5      # OUTER gate frame size in Liftoff metres. CALIBRATE per track
  nominal_height_m: 1.5
  # HSV ranges (OpenCV: H 0-179) of the gate frame colour; red needs two ranges. CALIBRATE
  hsv_ranges:
    - [[0, 120, 80], [10, 255, 255]]
    - [[170, 120, 80], [179, 255, 255]]
  min_area_frac: 0.0005
  approx_eps: 0.04
  morph_kernel: 5
  assoc_radius: 1.0         # x aperture: association gate for re-detecting the tracked gate
  lost_timeout_s: 1.0       # hold the last estimate this long, then fail-safe
  acquire_timeout_s: 3.0    # hover in place this long waiting for the first gate
  pass_area_frac: 0.2       # gate area fraction that, once vanished nearby, counts as a pass
  gates_per_lap: null       # set to count laps
  # `learned` gate estimator (parts.gate_estimator: learned): keypoint net + PnP per gate type.
  learned:
    weights: null           # trained by `drone-fly harness train-gates`; relative = repo root
    device: auto            # auto | cpu | cuda
    fp16: true              # half precision on CUDA
    input_width: 768        # network input width (frames are resized, aspect kept)
    score_threshold: 0.3    # centre-heatmap score for a detection
    min_keypoints: 4        # visible keypoints needed for PnP
    max_detections: 8
    async_inference: false  # true: run the network on a worker thread (loop uses the latest result)

# Gate styles: itemID regex -> class + dimensions (Liftoff metres, Unity-local x right / y up).
# Shared by the offline tools (route parsing, auto-labelling, scoring) and the learned estimator
# (class -> dimensions for PnP). `keypoints` default to the 4 outer corners; `flip_pairs` name
# left/right keypoint pairs (swapped for horizontal flips and gates seen from behind).
gate_types:
  - class: square_gate
    match: "(?i)gate"
    aperture: [1.5, 1.5]
    outer: [1.5, 1.5]       # today's nominal 1.5 x 1.5 m gate (gates.nominal_*)
    center_offset: [0.0, 0.75, 0.0]
    keypoints: null
    flip_pairs: [[0, 1], [2, 3]]
    outline: null           # tube centre line for depth-fit ground truth (null = keypoint polygon)
    tube_radius: 0.0

# Focus fail-safe (parts.focus_probe: win32-foreground): pad input reaches whichever window is
# focused, so the run waits for the game window, then fails safe if it loses focus.
focus:
  process_name: Liftoff.exe
  title_regex: null         # optional extra check on the window title
  wait_for_focus_s: 15.0    # time allowed to click into the game after arming
  auto_focus: true          # try to bring the game window to the foreground when a run starts

# Oracle gate source (UC69, `harness run --teacher ... --perception oracle`): exact gate poses
# from the catalogue track + telemetry. Diagnostic only: never selectable for training. The
# episode-monitor rules are fixed module constants (harness/oracle.py), recorded in the report.
oracle:
  # Tick 0 (before Arm): the telemetry spawn vs. the track XML spawn; a mismatch exits 6.
  start_tolerance:
    horizontal_m: 1.0
    dz_m: 1.0
    yaw_deg: 20.0
    speed_mps: 0.3

free_space:
  assume_no_obstacles: false  # `none` estimator: set true to fly 12/30-dim models obstacle-free

# `depth` free-space estimator (parts.free_space_estimator: depth) -> raycast for 70-dim models.
depth:
  backend: depth-anything-v2
  model_id: depth-anything/Depth-Anything-V2-Metric-Outdoor-Small-hf   # downloaded on first use
  device: auto              # auto | cpu | cuda
  inverse: false            # true if the model outputs inverse depth (then calibrate that)
  model_kwargs: {}          # extra from_pretrained() kwargs (free-form)
  calibration:              # metres = scale * raw + shift. CALIBRATE (offline eval suggests scale)
    scale: 1.0
    shift: 0.0
    min_depth_m: 0.05
  patch_px: 3               # half-size of the depth patch sampled per ray
  patch_percentile: 10.0    # robust patch minimum
  ray_range_scale: 1.0      # clamp/normalise at RAY_RANGE * this (training metres)
  fill_policy: nearest_in_fov   # rays outside the camera image: clear | nearest_in_fov | hold_last
  hold_max_age_s: 0.5       # hold_last: max age of a held ray value
  obstacle_vision: depth_clusters   # depth_clusters | zeros
  near_m: 3.0               # depth_clusters: pixels nearer than this (Liftoff m) form obstacles
  cluster_stride: 8         # depth_clusters: pixel subsampling
  min_cluster_cells: 4
  ground:                   # depth hits this close to the ground are not obstacles
    z_m: 0.0                # ground height (Liftoff metres); null disables the rejection
    height_m: 0.15
  warmup_timeout_s: 60.0    # wait for the first depth map (model load) before the loop starts

controls:
  # Only with `drone: null`: the Liftoff rate profile per axis (Betaflight rates; rc_rate 1.0 =
  # 100), e.g. {roll: {rc_rate: 1.0, super_rate: 0.7, expo: 0.0}, pitch: ..., yaw: ...}, and the
  # stick position [-1, 1] that hovers the airframe (the reference-plant collective map is
  # anchored there). null with a drone (its profile gives both).
  rates: null
  hover_stick: null
  rate_scale: 1.0           # multiplies commanded body rates before the inverse rate curve
  axis_map: {throttle: left_y, yaw: left_x, pitch: right_y, roll: right_x}   # mode 2
  # stick = sign * inverse_rate(body rate): +wx roll right, +wy pitch forward (nose down),
  # +wz is counter-clockwise, i.e. yaw stick LEFT. Flip a sign if Liftoff's binding inverts an axis.
  stick_signs: {roll: 1, pitch: 1, yaw: -1}
  # Arm / disarm on the virtual pad: bind Liftoff's "Arm" and "Disarm" to these buttons
  # (Settings > Controls, with the pad connected). null = no arming (Liftoff must not require it).
  arm_button: null          # pulsed once flying starts: null | A B X Y LB RB BACK START LS RS DPAD_*
  disarm_button: null       # pulsed on every fail-safe; null = pulse arm_button again (toggle)
  arm_press_s: 0.15         # button pulse length (s)
  arm_settle_s: 0.5         # after Arm: sticks neutral, throttle at minimum (no arming at throttle-up)
  arm_confirm_s: 3.0        # fail safe (not_armed) if motor RPM stays 0 this long after Arm; 0 = off
  disarm_press_s: 0.3       # Disarm pulse length (a 0.15 s press was missed by Liftoff)
  disarm_confirm_s: 2.0     # after a stop: re-press Disarm every 0.5 s until motor RPM is 0
  keep_pad_connected: false # true: after a stop keep the pad plugged in (neutral, disarmed) until Ctrl+C
  pad: local                # local: one ViGEm pad per run | server: drive the long-lived `harness pad`
  pad_port: 9200            # server mode: localhost UDP port of `drone-fly harness pad`
  pad_timeout_s: 0.5        # server watchdog: neutral + throttle minimum after this long without input

# Offline evaluation only (`drone-fly harness eval`): how track/race XML items map to geometry.
# Never used at runtime. CALIBRATE the item table to your track's itemIDs.
offline:
  race_id_tag: instanceID   # race XML element listing gate instance ids in order
  laps: null                # null -> race XML laps/lapCount, else 1
  item_table:               # first regex match on itemID wins; dimensions in Liftoff metres
    - {match: "(?i)gate", kind: gate, width: 1.5, height: 1.5}
    - {match: "(?i)pillar|pole|cylinder", kind: cylinder, radius: 0.3, height: 3.0}
    - {match: "(?i)cube|box|block|wall", kind: box, size: [1.0, 1.0, 1.0]}

abort:
  key: F12                  # hotkey that triggers the fail-safe (works with the game focused)
  poll_s: 0.02

# Live brain + debug overlay (UC-65): `drone-fly harness overlay` draws what the runner publishes
# on a localhost UDP stream. See docs/adr/0004-live-overlay.md.
overlay:
  enabled: false            # publish to the overlay (or `harness run --overlay`)
  port: 9100                # localhost UDP port; must differ from telemetry.port
  brain_every_n: 3          # brain frame every Nth tick (50 Hz / 3 ~ 16 Hz)
  brain_scale: recorder     # recorder (fixed [-1, 1] uint8, AC2) | frame_peak (per-frame scale)
  layout: default           # default (panels at the screen edges) | mask_confined (inside camera.masks)
  fps: 20                   # overlay redraw rate, 1-20 (CPU rendering; keep it low)
  stale_s: 1.0              # "no data for N s" after this long without a datagram
  gain_window_s: 5.0        # brain panel: running per-neuron gain window
  opacity: 0.85             # panel opacity 0-1
  tap_outline: false        # brain panel: outline the readout's tap neurons
  recordable: false         # true: screen recorders (OBS, Game Bar) can capture the overlay; the
                            # runner then masks the overlay's panels out of its own capture
  panels:                   # per-panel toggles
    brain: true
    action: true
    inputs: true
    raycast: true
    perception: true
    health: true
    telemetry: true

recording:
  enabled: true
  output_root: null         # null -> <repo>/artifacts/harness
  frame_every_n: 10         # save every 10th frame (0 = metadata only)
  queue_size: 4096
